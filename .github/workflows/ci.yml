name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: strikebook
          POSTGRES_PASSWORD: strikebook
          POSTGRES_DB: strikebook
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U strikebook"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://strikebook:strikebook@localhost:5432/strikebook
      ORIGIN: http://localhost:4173
      BETTER_AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters
      PROVIDER_KEY_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 12.14.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @strikebook/web db:migrate
      - run: pnpm --filter @strikebook/web exec playwright install --with-deps chromium
      - run: pnpm --filter @strikebook/web test:e2e

  desktop:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v5
      - name: System libraries for Tauri
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
      - uses: pnpm/action-setup@v5
        with:
          version: 12.14.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Build the webview bundle (tauri.conf.json frontendDist)
        working-directory: .
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @strikebook/desktop build
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
