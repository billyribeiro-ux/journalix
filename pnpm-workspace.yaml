packages:
  - apps/*
  - packages/*

# Supply-chain protection: never install a version published less than 24 hours ago.
minimumReleaseAge: 1440

# pnpm 12 runs no install scripts unless the package is allowed by name.
allowBuilds:
  esbuild: true

# One version of every shared dependency across the workspace.
catalog:
  '@eslint/js': 10.0.1
  '@fontsource-variable/ibm-plex-sans': 5.3.0
  '@fontsource/ibm-plex-mono': 5.3.0
  '@fontsource/instrument-serif': 5.3.0
  '@playwright/test': 1.64.1
  '@sveltejs/adapter-node': 6.0.0
  '@sveltejs/adapter-static': 4.0.0
  '@sveltejs/kit': 3.1.0
  '@sveltejs/vite-plugin-svelte': 7.3.1
  '@tauri-apps/api': 2.12.4
  '@tauri-apps/cli': 2.12.3
  '@tauri-apps/plugin-http': 2.8.3
  '@types/d3': 7.4.3
  '@types/node': 24.19.2
  '@vitest/browser-playwright': 5.0.5
  auth: 1.7.11
  better-auth: 1.7.11
  d3: 7.9.0
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.4
  eslint: 10.13.0
  eslint-config-prettier: 10.1.8
  eslint-plugin-svelte: 3.23.1
  globals: 17.13.0
  lightweight-charts: 5.2.1
  phosphor-svelte: 3.1.1
  playwright: 1.64.1
  postgres: 3.4.9
  prettier: 3.9.10
  prettier-plugin-svelte: 4.1.1
  svelte: 5.57.2
  svelte-check: 4.7.7
  typescript: 6.0.3
